name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake cppcheck clang-format
      
      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Run cppcheck
        run: cmake --build build --target cppcheck

      - name: Check formatting
        run: find tests -name '*.c' -o -name '*.h' | xargs clang-format --dry-run --Werror